dynamicPlugins:
  plugins:
    # This list replaces the one in values_showcase.yaml, so repeat the guest
    # auth provider. Auth providers are no longer built into the backend, and
    # without it the guest session has no user token (TechDocs returns 401).
    - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-auth-backend-module-guest-provider:bs_1.54.6__0.2.22"
      enabled: true
    #  sanity check https://issues.redhat.com/browse/RHIDP-5301
    - package: ref://backstage-plugin-catalog-backend-module-gitlab-org
      enabled: true
      pluginConfig:
        catalog:
          providers:
            gitlab:
              orgProvider:
                host: temp
                schedule:
                  frequency:
                    hours: 24
                  initialDelay:
                    seconds: 15
                  timeout:
                    minutes: 15
    - package: ref://backstage-plugin-scaffolder-backend-module-gitlab
      enabled: true
    - package: ref://red-hat-developer-hub-backstage-plugin-homepage
      enabled: true
    - package: ref://backstage-community-plugin-scaffolder-backend-module-regex
      enabled: true
    - package: ref://backstage-community-plugin-catalog-backend-module-scaffolder-relation-processor
      enabled: true
    - package: ref://backstage-plugin-catalog-backend-module-msgraph
      enabled: true
      pluginConfig:
        catalog:
          providers:
            microsoftGraphOrg:
              providerId:
                target: https://graph.microsoft.com/v1.0
                tenantId: temp
                clientId: temp
                clientSecret: temp
                schedule:
                  # Let's perform a single execution per test run
                  frequency:
                    hours: 24
                  initialDelay:
                    seconds: 15
                  timeout:
                    minutes: 15
    - package: ref://backstage-plugin-catalog-backend-module-ldap
      enabled: true
      pluginConfig:
        catalog:
          providers:
            ldapOrg:
              default:
                target: ldap://temp
                bind:
                  dn: temp
                  secret: temp
                users:
                  - dn: temp
                    options:
                      filter: (uid=*)
                groups:
                  - dn: temp
                    options:
                      filter: (cn=*)
                schedule:
                  # Let's perform a single execution per test run
                  frequency:
                    hours: 24
                  initialDelay:
                    seconds: 15
                  timeout:
                    minutes: 15
